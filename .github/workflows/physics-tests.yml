name: Physics and dynamic pilot tests

on:
  pull_request:
    branches:
      - codex/industrial-physics-audit
      - claude/understand-document-improve-g8xoM
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physics-tests:
    name: Python 3.11 / Ubuntu / Qt offscreen
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core

      - name: Install project and test dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-xdist
          mkdir -p ci-artifacts
          python -m pip freeze > ci-artifacts/installed-packages.txt

      - name: Run the complete regression suite
        run: |
          python -m pytest tests -q -n 2 --dist loadfile --durations=15 --junitxml=ci-artifacts/pytest.xml 2>&1 | tee ci-artifacts/pytest.log

      - name: Check dynamic conservation and solver agreement
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python gate_dynamic_pilot.py --out ci-artifacts/dynamic-pilot.json 2>&1 | tee ci-artifacts/dynamic-pilot.log

      - name: Save numerical test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: physics-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
